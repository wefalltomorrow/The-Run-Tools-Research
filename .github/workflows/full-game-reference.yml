name: Inventory full PC game reference

on:
  push:
    branches:
      - full-game-reference-inventory
  workflow_dispatch:

concurrency:
  group: full-game-reference-inventory
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          command -v 7z
          python3 -m pip install --user --upgrade gdown
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show disk before download
        run: df -h

      - name: Download split archive from shared Google Drive folder
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p parts
          cat > parts-manifest.tsv <<'EOF'
          001	1ElGa6JG-9Y7eAPR5lb2nBPFweflMi63t
          002	1cZe78AXGSBvFy5E0bQyru1vUWPrhosFw
          003	10375U1vf9mDH-5LJdS3_A-T6DOkEXPjF
          004	1yUUI6OS0fMkg2k3m5wBOGfm4AO80Xp-L
          005	1dGtovC2p9ZbdEXEvC0GlHcSUZ1Y2tFsx
          006	1Ez10bRv_m2H17xdtIiuFo2HRtdC8DxoG
          007	1mxAj_DUbJUvr7EL4UnT9TRLKLIl718sS
          008	1-XSsTyehk_Ag7TqKbPJYav3nPoR8u-Hu
          009	1HgHDY9EtOOVZw15-pZ5EYNtU3mLlBchf
          010	100gDW1zjawk4RBi94C7ckrhVbnNJ5ZzF
          011	15meHYmBxlTlO4WHaoE1XoX3EMJRgNXUF
          012	1id3_tb6pC3e96v3-An0A-p5J9OzUzcGA
          013	1BL4702rebmbCiEMojrO_r8j211R_dukZ
          014	1F5MvKMTfHoo8XZwsZNNrYq8Zz9lbtpWz
          015	1QJq3BtHZsw2LQgigCQNWyga-xmQEExMy
          016	14lctaIjA9C-WrvynqaPNj-UIPgglKWKf
          017	1KQcNDTYGbXZFl43h96fvv-mFZeKlvQj8
          018	1uGi_4a7B0k4r1a0sl_glg01fGvuDddK-
          019	1cV4gdL-w8aJGbhb1GJPUuQSCQmtAAOI4
          020	1wx4vsbNwipSulnbpwW9LhssGpWCQ18ck
          021	172NdQItICmAxicH8D204BYuzKo1ZOQuf
          022	1zwnxYW6D2IolqQVzS-t_HbWxjc62-awm
          023	1cDMyn_EpvenFVsEeJceC7Ze1iWoMBKnJ
          024	1YN9LhyP3WYk91TQHuLF5wbwTEWu22y_V
          025	1IMI5-xcPC-UtxTtf76RNl0bWV0SMMJrm
          026	11anvX4B8YgOMawrJNz2ReU514AVLWoB9
          027	15Z267FPZQKrzW3_MkuZYI_X19QBnN-JZ
          028	1K_uUUDKdT1NfHjU657MZAz9GJ1T8S2nv
          029	1cU5uU3Na8B6F6B8Q6WhzkNnkZLFb3zFP
          030	1SqpDFFWYdSqn0oiDMDnYVg06RnplRx7m
          031	1emp8dsR31En5ur9RDWz0UMC-Ozew4nMX
          032	1vPb6xoZX41G_1r7n0iZ-aku-5mPl8W2O
          033	154aKx28kvDXvGbwkjZpwSopDBEV0BZDS
          034	16V44SAWfPQeVgG-8XekJnrro2RKkczGJ
          035	1IMg1AItyDyALoXnw1O6Dq6JkETuHyEm1
          036	1AyD3EYMrs_VhKWwX1pFp8kRh3q8JXPfE
          037	1CKz4bPuQ_NtW85AcjBYCMBNkCnv2-lLQ
          038	1dwqmLRCcrGhCT1GKZ4iyIkFHfcPg3xCN
          EOF

          download_one() {
            seq="$1"
            id="$2"
            out="parts/Need for Speed The Run.7z.${seq}"
            for attempt in 1 2 3; do
              if gdown "$id" -O "$out"; then
                test -s "$out" && return 0
              fi
              rm -f "$out"
              sleep $((attempt * 5))
            done
            echo "FAILED part $seq" >&2
            return 1
          }
          export -f download_one
          xargs -P 6 -n 2 bash -c 'download_one "$0" "$1"' < parts-manifest.tsv

          find parts -maxdepth 1 -type f -printf '%f\t%s\n' | sort > downloaded-parts.tsv
          cat downloaded-parts.tsv
          count=$(find parts -maxdepth 1 -type f -name 'Need for Speed The Run.7z.*' | wc -l)
          test "$count" -eq 38
          test "$(stat -c %s 'parts/Need for Speed The Run.7z.001')" -eq 267386880
          test "$(stat -c %s 'parts/Need for Speed The Run.7z.037')" -eq 267386880
          test "$(stat -c %s 'parts/Need for Speed The Run.7z.038')" -eq 113356003
          sha256sum parts/'Need for Speed The Run.7z.'* > part-sha256.txt
          df -h

      - name: Validate and inventory split 7z archive
        shell: bash
        run: |
          set -euxo pipefail
          archive='parts/Need for Speed The Run.7z.001'
          7z l -ba "$archive" > full-game-7z-list.txt
          7z l -slt "$archive" > full-game-7z-slt.txt
          7z t "$archive" | tee full-game-7z-test.txt

      - name: Build machine-readable archive inventory
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv

          src = Path('full-game-7z-slt.txt').read_text(errors='replace').splitlines()
          rows = []
          rec = {}
          wanted = ['Path','Size','Packed Size','Modified','Attributes','CRC','Encrypted','Method','Block']
          for line in src:
              if ' = ' in line:
                  k, v = line.split(' = ', 1)
                  rec[k] = v
              elif not line.strip() and rec:
                  if 'Path' in rec and rec.get('Folder') != '+':
                      rows.append({k: rec.get(k, '') for k in wanted})
                  rec = {}
          if rec and 'Path' in rec and rec.get('Folder') != '+':
              rows.append({k: rec.get(k, '') for k in wanted})

          with open('full-game-archive-inventory.csv', 'w', newline='', encoding='utf-8-sig') as f:
              w = csv.DictWriter(f, fieldnames=wanted)
              w.writeheader(); w.writerows(rows)

          total = sum(int(r['Size'] or 0) for r in rows)
          print(f'Files: {len(rows)}')
          print(f'Uncompressed bytes: {total}')
          PY

      - name: Extract useful small/reference file types
        shell: bash
        run: |
          set -euxo pipefail
          archive='parts/Need for Speed The Run.7z.001'
          mkdir -p inspect
          7z x "$archive" -oinspect -y -r \
            '*.toc' '*.cat' '*.ini' '*.cfg' '*.xml' '*.txt' '*.json' '*.csv' '*.md' \
            '*.exe' '*.dll' '*.asi' '*.bat' '*.cmd' '*.ps1' '*.reg' \
            | tee selective-extract.txt
          find inspect -type f -printf '%P\t%s\n' | sort > selective-files.tsv
          find inspect -type f -print0 | sort -z | xargs -0 sha256sum > selective-sha256.txt || true
          du -sh inspect || true
          df -h

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: NFSTR-full-game-reference-inventory
          path: |
            downloaded-parts.tsv
            part-sha256.txt
            full-game-7z-list.txt
            full-game-7z-slt.txt
            full-game-7z-test.txt
            full-game-archive-inventory.csv
            selective-extract.txt
            selective-files.tsv
            selective-sha256.txt
          if-no-files-found: error
          compression-level: 9

      - name: Upload selected reference files
        uses: actions/upload-artifact@v4
        with:
          name: NFSTR-full-game-reference-selected-files
          path: inspect/
          if-no-files-found: warn
          compression-level: 6
